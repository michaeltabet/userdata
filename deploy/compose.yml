#
# Runs USERDATA behind a Cloudflare Tunnel at v1.aggviz.com. No port is
# opened on the host. Tokens come from the environment, filled from
# Bitwarden Secrets Manager at start (never written to disk):
#   bws run -- docker compose -f deploy/compose.yml up -d
services:
  userdata:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      USERDATA_SEC_USER_AGENT: ${USERDATA_SEC_USER_AGENT}
      USERDATA_AUTH_ISSUER: ${USERDATA_AUTH_ISSUER}
      USERDATA_AUTH_AUDIENCE: ${USERDATA_AUTH_AUDIENCE}
      USERDATA_PUBLIC_URL: https://v1.aggviz.com
    volumes:
      - /srv/data/userdata:/data
    networks: [userdata]

  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${USERDATA_TUNNEL_TOKEN}
    depends_on: [userdata]
    networks: [userdata]

networks:
  userdata: {}
