#
# USERDATA on vm1, published the same way as the tracker MCP: a Tailscale
# Funnel container (tag:funnel) in front of the server, on the stack's
# `stack` network, at https://userdata.tail05f41d.ts.net. The image is
# built on testing and loaded onto vm1 (no source code on prod). Secrets
# come from the environment at start, never from files written here.
services:
  userdata:
    image: userdata:${USERDATA_VERSION:-latest}
    container_name: userdata-server
    restart: unless-stopped
    environment:
      HOME: /data
      EDGAR_LOCAL_DATA_DIR: /data/edgar
    volumes:
      - ${USERDATA_DATA_DIR}:/data
      - ./userdata.toml:/app/userdata.toml:ro
    networks: [stack]

  userdata-funnel:
    image: tailscale/tailscale:v1.102.4
    container_name: userdata-funnel
    hostname: userdata
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_FUNNEL_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - /srv/stack/funnel/userdata:/var/lib/tailscale
      - ./funnel-userdata.json:/config/serve.json:ro
    depends_on: [userdata]
    networks: [stack]

networks:
  stack:
    external: true
