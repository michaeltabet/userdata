#
# USERDATA's sign-in: an authentik OAuth2/OpenID provider and application,
# the same shape as the tracker MCP's. Claude's connector (claude.ai,
# Desktop, the phone app) and Claude Code are public clients: no secret,
# authorization code with PKCE, the pre-registered client id
# `userdata-mcp`. Only akadmin may sign in. Install by copying this file to
# the stack repo's authentik/blueprints/; the worker applies it.
version: 1
metadata:
  name: USERDATA MCP
entries:
  # The scope USERDATA requires in every access token. It adds no claims.
  - model: authentik_providers_oauth2.scopemapping
    id: scope-userdata
    identifiers:
      managed: basci/userdata-mcp/scope-userdata
    attrs:
      name: "USERDATA MCP: userdata"
      scope_name: userdata
      description: "Read and write your research account"
      expression: |
        return {}

  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: userdata-mcp
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: public
      client_id: userdata-mcp
      grant_types: [authorization_code, refresh_token]
      redirect_uris:
        - matching_mode: regex
          url: '^http://(localhost|127\.0\.0\.1):[0-9]{1,5}/callback$'
          redirect_uri_type: authorization
        - matching_mode: strict
          url: 'https://claude.ai/api/mcp/auth_callback'
          redirect_uri_type: authorization
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      issuer_mode: per_provider
      sub_mode: hashed_user_id
      access_code_validity: minutes=1
      access_token_validity: hours=1
      refresh_token_validity: days=30
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
        - !KeyOf scope-userdata

  - model: authentik_core.application
    id: application
    identifiers:
      slug: userdata-mcp
    attrs:
      name: USERDATA MCP
      provider: !KeyOf provider
      policy_engine_mode: any
      meta_launch_url: blank://blank

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf application
      order: 0
    attrs:
      user: !Find [authentik_core.user, [username, akadmin]]
      enabled: true
      timeout: 30
